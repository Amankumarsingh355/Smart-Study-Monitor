version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-study-monitor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - SSM_DB_PATH=/app/data/study_monitor.db
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js Dashboard frontend (when launched in container)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: smart-study-monitor-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/monitor
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
